<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5dba8"><title>Tidemill</title><style>
:root{--ink:#3e4548;--paper:#f7ecd5;--glass:rgba(255,248,230,.82)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#84cdd0;font-family:ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:3;top:max(16px,env(safe-area-inset-top));left:18px;pointer-events:none}.mark{font-family:Georgia,serif;font-size:25px;letter-spacing:.06em;color:#344c4d;text-shadow:0 1px #fff8}.sub{font:700 9px/1.5 system-ui;letter-spacing:.22em;text-transform:uppercase;opacity:.58}.tools{position:fixed;z-index:4;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;background:var(--glass);border:1px solid rgba(78,76,64,.13);box-shadow:0 10px 30px rgba(46,81,82,.18);border-radius:24px;backdrop-filter:blur(14px);max-width:calc(100vw - 24px)}button{font:700 12px system-ui;color:var(--ink);border:0;background:transparent;height:38px;min-width:38px;border-radius:18px;padding:0 12px;cursor:pointer}button:active{transform:scale(.94)}.round{font-size:19px;padding:0}.round.active{background:#fffdf6;box-shadow:0 2px 8px #607b7633}.colors{display:flex;gap:6px;padding:0 4px;border-left:1px solid #6c6a5e22;border-right:1px solid #6c6a5e22}.sw{width:27px;min-width:27px;height:27px;padding:0;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px #fff9,0 1px 4px #3454}.sw.on{outline:2px solid #4d5555;outline-offset:2px}.hint{position:fixed;z-index:2;top:max(70px,calc(env(safe-area-inset-top) + 58px));left:50%;transform:translateX(-50%);font:650 11px system-ui;letter-spacing:.03em;color:#40595a;background:rgba(255,250,235,.72);padding:7px 12px;border-radius:15px;backdrop-filter:blur(10px);transition:.5s;white-space:nowrap}.hint.hide{opacity:0;transform:translate(-50%,-8px)}.count{position:fixed;right:16px;top:max(18px,env(safe-area-inset-top));font:800 11px system-ui;color:#4c6262;background:#fff9;padding:8px 10px;border-radius:14px;z-index:2}.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:#fffdf0dd;padding:12px 17px;border-radius:18px;font:700 12px system-ui;opacity:0;transition:.25s;pointer-events:none;z-index:8}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}@media(max-width:420px){.tools{gap:3px;padding:7px}.colors{gap:5px}.sw{width:25px;min-width:25px;height:25px}button{padding:0 9px}.wide{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><canvas id="c" aria-label="Interactive toy town"></canvas><div class="top"><div class="mark">TIDEMILL</div><div class="sub">a town that grows with the tide</div></div><div class="count" id="count">0 homes</div><div class="hint" id="hint">Tap the water to begin · drag to turn</div><div class="tools"><button class="round active" id="build" title="Build">＋</button><button class="round" id="remove" title="Remove">−</button><div class="colors" id="colors"></div><button id="new" class="wide">new tide</button><button class="round" id="sound" title="Sound">♪</button></div><div class="toast" id="toast"></div><script>
(()=>{const buildBtn=document.querySelector('#build'),removeBtn=document.querySelector('#remove'),colorsEl=document.querySelector('#colors'),soundBtn=document.querySelector('#sound'),newBtn=document.querySelector('#new'),countEl=document.querySelector('#count'),hintEl=document.querySelector('#hint'),toastEl=document.querySelector('#toast');const C=document.querySelector('#c'),X=C.getContext('2d');let W,H,dpr,angle=-.63,zoom=1,ox=0,oy=18,mode='build',color=0,drag=false,moved=false,lx=0,ly=0,audio=null;
const pal=['#d86f59','#e7a84d','#e8d8a8','#78a98d','#638ea4','#aa7c9d'];const cells=[],map=new Map(),N=9;function key(q,r){return q+','+r}function noise(q,r){return Math.sin(q*91.7+r*47.3)*.5+.5}for(let q=-N;q<=N;q++)for(let r=-N;r<=N;r++){let x=q+r*.18*Math.sin(r),y=r+q*.12*Math.cos(q);if(x*x*.75+y*y<67+noise(q,r)*9){let j=.12*(noise(q+7,r)-.5);let c={q,r,x:x+j,y:y+j*.4,h:0,col:(q-r+24)%pal.length};cells.push(c);map.set(key(q,r),c)}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0);zoom=Math.min(W/430,H/700)*1.06;draw()}addEventListener('resize',resize);
function proj(c,z=0){let s=33*zoom,ca=Math.cos(angle),sa=Math.sin(angle),rx=c.x*ca-c.y*sa,ry=c.x*sa+c.y*ca;return{x:W/2+ox+rx*s,y:H*.54+oy+ry*s*.48-z*25*zoom}}
function poly(p,fill,stroke='#0002',lw=1){X.beginPath();X.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)X.lineTo(p[i].x,p[i].y);X.closePath();X.fillStyle=fill;X.fill();if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.stroke()}}
function shade(hex,n){let a=hex.match(/\w\w/g).map(v=>parseInt(v,16));return '#'+a.map(v=>Math.max(0,Math.min(255,v+n)).toString(16).padStart(2,'0')).join('')}
function ring(c,z=0,scale=.47){let p=proj(c,z),s=33*zoom*scale;return[{x:p.x,y:p.y-s*.48},{x:p.x+s,y:p.y},{x:p.x,y:p.y+s*.48},{x:p.x-s,y:p.y}]}
function water(){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a9e1dc');g.addColorStop(.56,'#78c5ca');g.addColorStop(1,'#5aadb8');X.fillStyle=g;X.fillRect(0,0,W,H);X.globalAlpha=.11;X.strokeStyle='#fff';for(let y=40;y<H;y+=23){X.beginPath();for(let x=-20;x<W+20;x+=8){let yy=y+Math.sin(x*.028+y*.04+performance.now()*.00035)*2; x<0?X.moveTo(x,yy):X.lineTo(x,yy)}X.stroke()}X.globalAlpha=1}
function building(c){let base=ring(c,0,.45),top=ring(c,c.h,.45),front=angle<0?[2,3]:[1,2],side=angle<0?[1,2]:[2,3],col=pal[c.col];for(let z=0;z<c.h;z++){let b=ring(c,z,.43),t=ring(c,z+1,.43);poly([b[3],b[2],t[2],t[3]],shade(col,-23));poly([b[2],b[1],t[1],t[2]],shade(col,-8));if(z<c.h-1){let p=proj(c,z+.48);X.fillStyle='#f8e8bf';let wx=5*zoom,wh=7*zoom;X.fillRect(p.x-19*zoom,p.y-wh/2,wx,wh);X.fillRect(p.x+13*zoom,p.y-wh/2,wx,wh)}}let exposed=0;for(const [dq,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){let n=map.get(key(c.q+dq,c.r+dr));if(!n||n.h<c.h)exposed++}let t=ring(c,c.h,.43),p=proj(c,c.h);if(exposed>=2){let roof=shade(col,-35),peak={x:p.x,y:p.y-16*zoom};poly([t[3],t[0],peak,t[2]],roof);poly([t[0],t[1],t[2],peak],shade(roof,15));X.strokeStyle='#fff6';X.beginPath();X.moveTo(peak.x,peak.y);X.lineTo(t[2].x,t[2].y);X.stroke()}else{poly(t,shade(col,22));X.fillStyle='#fff8';X.fillRect(p.x-7*zoom,p.y-2,14*zoom,2)}if(c.h===1&&exposed>=3){X.fillStyle='#365357';X.beginPath();X.arc(p.x,p.y+14*zoom,6*zoom,0,Math.PI,true);X.fill()}if(c.h>=2&&noise(c.q,c.r)>.48){X.fillStyle='#405558';X.fillRect(p.x+9*zoom,p.y-26*zoom,4*zoom,12*zoom);X.fillStyle='#fff8';X.beginPath();X.arc(p.x+11*zoom,p.y-29*zoom,5*zoom,0,Math.PI*2);X.fill()}}
function draw(){water();let sorted=[...cells].sort((a,b)=>proj(a).y-proj(b).y);for(const c of sorted){let p=ring(c,0,.47);if(c.h===0){poly(p,'rgba(247,231,190,.11)','rgba(255,255,255,.16)',.7)}else{poly(ring(c,0,.5),'rgba(51,89,87,.24)',null);building(c)}}requestAnimationFrame(()=>{})}
let anim;function pulse(){cancelAnimationFrame(anim);let t0=performance.now();function f(t){draw();if(t-t0<520)anim=requestAnimationFrame(f)}anim=requestAnimationFrame(f)}function hit(x,y){let best=null,bd=999;for(const c of cells){let p=proj(c,c.h),dx=(x-p.x)/(25*zoom),dy=(y-p.y)/(17*zoom),d=dx*dx+dy*dy;if(d<bd&&d<1.25){bd=d;best=c}}return best}
function ping(up){if(!audio)audio=new(window.AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(up?260:190,audio.currentTime);o.frequency.exponentialRampToValueAtTime(up?520:120,audio.currentTime+.16);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.23)}
function act(x,y){let c=hit(x,y);if(!c)return;if(mode==='build'&&c.h<7){c.h++;c.col=color;ping(true)}else if(mode==='remove'&&c.h>0){c.h--;ping(false)}document.querySelector('#count').textContent=cells.reduce((s,c)=>s+c.h,0)+' homes';localStorage.tidemill=JSON.stringify(cells.map(c=>[c.h,c.col]));document.querySelector('#hint').classList.add('hide');pulse()}
C.onpointerdown=e=>{drag=true;moved=false;lx=e.clientX;ly=e.clientY;C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){angle+=dx*.006;oy+=dy*.35;lx=e.clientX;ly=e.clientY;draw()}};C.onpointerup=e=>{if(!moved)act(e.clientX,e.clientY);drag=false};C.onwheel=e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.65,zoom-e.deltaY*.001));draw()};
function setMode(m){mode=m;buildBtn.classList.toggle('active',m==='build');removeBtn.classList.toggle('active',m==='remove')}buildBtn.onclick=()=>setMode('build');removeBtn.onclick=()=>setMode('remove');pal.forEach((p,i)=>{let b=document.createElement('button');b.className='sw'+(!i?' on':'');b.style.setProperty('--c',p);b.onclick=()=>{color=i;document.querySelectorAll('.sw').forEach((x,j)=>x.classList.toggle('on',i===j))};colorsEl.appendChild(b)});soundBtn.onclick=()=>{ping(true);toastEl.textContent='sound on';toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),700)};newBtn.onclick=()=>{cells.forEach(c=>c.h=0);localStorage.removeItem('tidemill');countEl.textContent='0 homes';draw()};let saved=localStorage.tidemill;if(saved)try{JSON.parse(saved).forEach((v,i)=>{if(cells[i]){cells[i].h=v[0];cells[i].col=v[1]}})}catch{}else [[0,0,3],[1,0,2],[0,1,2],[1,-1,1],[-1,1,1],[-1,0,2],[2,-1,1]].forEach(([q,r,h],i)=>{let c=map.get(key(q,r));if(c){c.h=h;c.col=i%pal.length}});countEl.textContent=cells.reduce((s,c)=>s+c.h,0)+' homes';resize();setTimeout(()=>hintEl.classList.add('hide'),5000)})();
</script></body></html>
