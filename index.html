<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5dba8"><title>Tidemill</title><style>

:root{--ink:#314746;--cream:#fff5df}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7ebfc3;font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:var(--ink)}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:3;top:max(22px,env(safe-area-inset-top));left:22px;pointer-events:none}.mark{font-family:Georgia,"Iowan Old Style",serif;font-size:21px;font-weight:400;letter-spacing:.14em;color:#294746}.sub{display:none}.tools{position:fixed;z-index:4;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:0;max-width:calc(100vw - 28px)}button{font:600 12px system-ui;color:#35504e;border:0;background:rgba(255,249,233,.88);height:42px;min-width:42px;border-radius:50%;padding:0;cursor:pointer;box-shadow:0 6px 18px rgba(39,76,76,.13);backdrop-filter:blur(10px)}button:active{transform:scale(.93)}.round{font-size:18px}.round.active{background:#fff8e8;box-shadow:0 0 0 2px rgba(49,71,70,.68),0 7px 20px rgba(39,76,76,.15)}.colors{display:flex;gap:7px;padding:9px 11px;background:rgba(255,249,233,.86);border-radius:24px;box-shadow:0 6px 20px rgba(39,76,76,.13);backdrop-filter:blur(12px)}.sw{width:24px;min-width:24px;height:24px;padding:0;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}.sw.on{outline:1.5px solid #354d4c;outline-offset:3px}.hint{position:fixed;z-index:2;top:max(58px,calc(env(safe-area-inset-top) + 46px));left:22px;font:600 10px system-ui;letter-spacing:.04em;color:rgba(41,71,70,.66);transition:.5s;white-space:nowrap}.hint.hide{opacity:0;transform:translateY(-5px)}.count{position:fixed;right:20px;top:max(25px,env(safe-area-inset-top));font:600 10px system-ui;letter-spacing:.08em;text-transform:uppercase;color:rgba(41,71,70,.64);z-index:2}.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:#fff8e8;padding:10px 15px;border-radius:18px;font:600 11px system-ui;opacity:0;transition:.25s;pointer-events:none;z-index:8}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.wide,#sound{display:none}@media(max-width:420px){.tools{gap:8px}.colors{gap:7px;padding:9px 11px}.sw{width:23px;min-width:23px;height:23px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><canvas id="c" aria-label="Interactive toy town"></canvas><div class="top"><div class="mark">TIDEMILL</div><div class="sub">a town that grows with the tide</div></div><div class="count" id="count">0 homes</div><div class="hint" id="hint">Tap the water to begin · drag to turn</div><div class="tools"><button class="round active" id="build" title="Build">＋</button><button class="round" id="remove" title="Remove">−</button><div class="colors" id="colors"></div><button id="new" class="wide">new tide</button><button class="round" id="sound" title="Sound">♪</button></div><div class="toast" id="toast"></div><script>
(()=>{const buildBtn=document.querySelector('#build'),removeBtn=document.querySelector('#remove'),colorsEl=document.querySelector('#colors'),soundBtn=document.querySelector('#sound'),newBtn=document.querySelector('#new'),countEl=document.querySelector('#count'),hintEl=document.querySelector('#hint'),toastEl=document.querySelector('#toast');const C=document.querySelector('#c'),X=C.getContext('2d');let W,H,dpr,angle=-.63,zoom=1,ox=0,oy=18,mode='build',color=0,drag=false,moved=false,lx=0,ly=0,audio=null;
const pal=['#d86b57','#dc9b46','#efe0b7','#75a28a','#5e899a','#9d7692'];const cells=[],map=new Map(),N=9;function key(q,r){return q+','+r}function noise(q,r){return Math.sin(q*91.7+r*47.3)*.5+.5}for(let q=-N;q<=N;q++)for(let r=-N;r<=N;r++){let x=q+r*.18*Math.sin(r),y=r+q*.12*Math.cos(q);if(x*x*.75+y*y<67+noise(q,r)*9){let j=.12*(noise(q+7,r)-.5);let c={q,r,x:x+j,y:y+j*.4,h:0,col:(q-r+24)%pal.length};cells.push(c);map.set(key(q,r),c)}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0);zoom=Math.min(W/390,H/690)*1.22;draw()}addEventListener('resize',resize);
function proj(c,z=0){let s=33*zoom,ca=Math.cos(angle),sa=Math.sin(angle),rx=c.x*ca-c.y*sa,ry=c.x*sa+c.y*ca;return{x:W/2+ox+rx*s,y:H*.51+oy+ry*s*.48-z*25*zoom}}
function poly(p,fill,stroke='#0002',lw=1){X.beginPath();X.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)X.lineTo(p[i].x,p[i].y);X.closePath();X.fillStyle=fill;X.fill();if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.stroke()}}
function shade(hex,n){let a=hex.match(/\w\w/g).map(v=>parseInt(v,16));return '#'+a.map(v=>Math.max(0,Math.min(255,v+n)).toString(16).padStart(2,'0')).join('')}
function ring(c,z=0,scale=.47){let p=proj(c,z),s=33*zoom*scale;return[{x:p.x,y:p.y-s*.48},{x:p.x+s,y:p.y},{x:p.x,y:p.y+s*.48},{x:p.x-s,y:p.y}]}
function water(){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#b7ded5');g.addColorStop(.34,'#91cfca');g.addColorStop(.72,'#69b5bc');g.addColorStop(1,'#4f9faa');X.fillStyle=g;X.fillRect(0,0,W,H);let glow=X.createRadialGradient(W*.52,H*.38,10,W*.52,H*.38,W*.65);glow.addColorStop(0,'rgba(255,235,188,.20)');glow.addColorStop(1,'rgba(255,235,188,0)');X.fillStyle=glow;X.fillRect(0,0,W,H);X.globalAlpha=.075;X.strokeStyle='#fff';for(let y=40;y<H;y+=23){X.beginPath();for(let x=-20;x<W+20;x+=8){let yy=y+Math.sin(x*.028+y*.04+performance.now()*.00035)*2; x<0?X.moveTo(x,yy):X.lineTo(x,yy)}X.stroke()}X.globalAlpha=1}
function neighbors(c){return [[1,0],[-1,0],[0,1],[0,-1]].map(([q,r])=>map.get(key(c.q+q,c.r+r)))}function building(c){let ns=neighbors(c),occupied=ns.filter(n=>n&&n.h>0).length,bridge=c.h===1&&((ns[0]?.h&&ns[1]?.h&&!ns[2]?.h&&!ns[3]?.h)||(ns[2]?.h&&ns[3]?.h&&!ns[0]?.h&&!ns[1]?.h));let base=ring(c,0,.45),top=ring(c,c.h,.45),front=angle<0?[2,3]:[1,2],side=angle<0?[1,2]:[2,3],col=pal[c.col];for(let z=0;z<c.h;z++){let b=ring(c,z,.43),t=ring(c,z+1,.43);poly([b[3],b[2],t[2],t[3]],shade(col,-38));poly([b[2],b[1],t[1],t[2]],shade(col,-4));X.strokeStyle='rgba(255,247,216,.22)';X.lineWidth=.7;X.beginPath();X.moveTo(t[3].x,t[3].y);X.lineTo(t[2].x,t[2].y);X.lineTo(t[1].x,t[1].y);X.stroke();if(z<c.h-1){let p=proj(c,z+.48);X.fillStyle='#f8e8bf';let wx=5*zoom,wh=7*zoom;X.fillRect(p.x-19*zoom,p.y-wh/2,wx,wh);X.fillRect(p.x+13*zoom,p.y-wh/2,wx,wh)}}let exposed=0;for(const [dq,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){let n=map.get(key(c.q+dq,c.r+dr));if(!n||n.h<c.h)exposed++}let t=ring(c,c.h,.43),p=proj(c,c.h);if(exposed>=2){let roof=shade(col,-35),peak={x:p.x,y:p.y-16*zoom};poly([t[3],t[0],peak,t[2]],shade(roof,-8));poly([t[0],t[1],t[2],peak],shade(roof,28));X.strokeStyle='#fff6';X.beginPath();X.moveTo(peak.x,peak.y);X.lineTo(t[2].x,t[2].y);X.stroke()}else{poly(t,shade(col,22));X.fillStyle='#fff8';X.fillRect(p.x-7*zoom,p.y-2,14*zoom,2)}if(c.h===1&&exposed>=3){X.fillStyle='#365357';X.beginPath();X.arc(p.x,p.y+14*zoom,6*zoom,0,Math.PI,true);X.fill()}if(bridge){X.fillStyle='#70bec4';X.beginPath();X.ellipse(p.x,p.y+17*zoom,12*zoom,9*zoom,0,Math.PI,0);X.fill();X.strokeStyle='#f7e7c9';X.lineWidth=2*zoom;X.stroke()}if(c.h>=2&&noise(c.q,c.r)>.48){X.fillStyle='#405558';X.fillRect(p.x+9*zoom,p.y-26*zoom,4*zoom,12*zoom);X.fillStyle='#fff8';X.beginPath();X.arc(p.x+11*zoom,p.y-29*zoom,5*zoom,0,Math.PI*2);X.fill()}}
function draw(){water();let sorted=[...cells].sort((a,b)=>proj(a).y-proj(b).y);for(const c of sorted){let p=ring(c,0,.47);if(c.h===0){let ns=neighbors(c),enclosed=ns.filter(n=>n&&n.h>0).length>=3;if(enclosed){poly(p,'#90b985','#ffffff55',1);let cp=proj(c,0);X.fillStyle='#f4cf69';for(let i=0;i<5;i++){X.beginPath();X.arc(cp.x+Math.cos(i*2.2)*8*zoom,cp.y+Math.sin(i*2.2)*4*zoom,1.7*zoom,0,7);X.fill()}}else poly(p,'rgba(244,229,190,.045)','rgba(255,255,255,.10)',.55)}else{let sh=ring(c,0,.52).map(p=>({x:p.x+10*zoom+c.h*3*zoom,y:p.y+8*zoom+c.h*2*zoom}));poly(sh,'rgba(29,65,67,.12)',null);let ao=ring(c,0,.5).map(p=>({x:p.x,y:p.y+3*zoom}));poly(ao,'rgba(25,59,60,.25)',null);building(c)}}for(const c of sorted){if(!c.h)continue;for(const n of neighbors(c)){if(n&&n.h>0&&Math.abs(c.h-n.h)>=2&&proj(c).y>proj(n).y){let a=proj(c,Math.min(c.h,n.h)),b=proj(c,Math.max(c.h,n.h)-.15);X.strokeStyle='#f0d8aa';X.lineWidth=3*zoom;X.beginPath();X.moveTo(a.x-12*zoom,a.y);X.lineTo(b.x-12*zoom,b.y);X.stroke();X.strokeStyle='#825c4d';X.lineWidth=1;for(let j=0;j<Math.abs(c.h-n.h)*2;j++){let y=a.y+(b.y-a.y)*j/(Math.abs(c.h-n.h)*2);X.beginPath();X.moveTo(a.x-15*zoom,y);X.lineTo(a.x-9*zoom,y);X.stroke()}}}}let fog=X.createLinearGradient(0,H*.2,0,H*.63);fog.addColorStop(0,'rgba(225,241,226,.23)');fog.addColorStop(.58,'rgba(199,230,218,.07)');fog.addColorStop(1,'rgba(110,190,192,0)');X.fillStyle=fog;X.fillRect(0,0,W,H*.66);let vg=X.createRadialGradient(W*.5,H*.45,W*.12,W*.5,H*.48,W*.76);vg.addColorStop(.58,'rgba(20,64,68,0)');vg.addColorStop(1,'rgba(20,64,68,.14)');X.fillStyle=vg;X.fillRect(0,0,W,H);let tm=performance.now()*.00008;for(let i=0;i<3;i++){let bx=((tm*(38+i*9)+i*.27)%1)*W,by=H*(.67+i*.075)+Math.sin(tm*20+i)*9;X.save();X.translate(bx,by);X.fillStyle='#fff3d7';X.beginPath();X.moveTo(-12*zoom,0);X.lineTo(10*zoom,0);X.lineTo(5*zoom,5*zoom);X.lineTo(-8*zoom,5*zoom);X.closePath();X.fill();X.strokeStyle='#426d73';X.lineWidth=1;X.stroke();X.fillStyle='#d86f59';X.beginPath();X.moveTo(0,-13*zoom);X.lineTo(0,0);X.lineTo(9*zoom,0);X.closePath();X.fill();X.restore()}for(let i=0;i<4;i++){let gx=(W*(.16+i*.21)+Math.sin(tm*80+i)*22)%W,gy=H*.18+Math.sin(tm*55+i*1.7)*14;X.strokeStyle='rgba(55,79,79,.45)';X.lineWidth=1.2;X.beginPath();X.arc(gx-4,gy,5,Math.PI*1.1,Math.PI*1.85);X.arc(gx+4,gy,5,Math.PI*1.15,Math.PI*1.9);X.stroke()}}
let anim;function pulse(){cancelAnimationFrame(anim);let t0=performance.now();function f(t){draw();if(t-t0<520)anim=requestAnimationFrame(f)}anim=requestAnimationFrame(f)}function hit(x,y){let best=null,bd=999;for(const c of cells){let p=proj(c,c.h),dx=(x-p.x)/(25*zoom),dy=(y-p.y)/(17*zoom),d=dx*dx+dy*dy;if(d<bd&&d<1.25){bd=d;best=c}}return best}
function ping(up){if(!audio)audio=new(window.AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(up?260:190,audio.currentTime);o.frequency.exponentialRampToValueAtTime(up?520:120,audio.currentTime+.16);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.23)}
function act(x,y){let c=hit(x,y);if(!c)return;if(mode==='build'&&c.h<7){c.h++;c.col=color;ping(true)}else if(mode==='remove'&&c.h>0){c.h--;ping(false)}document.querySelector('#count').textContent=cells.reduce((s,c)=>s+c.h,0)+' blocks';localStorage.tidemill=JSON.stringify(cells.map(c=>[c.h,c.col]));document.querySelector('#hint').classList.add('hide');pulse()}
C.onpointerdown=e=>{drag=true;moved=false;lx=e.clientX;ly=e.clientY;C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){angle+=dx*.006;oy+=dy*.35;lx=e.clientX;ly=e.clientY;draw()}};C.onpointerup=e=>{if(!moved)act(e.clientX,e.clientY);drag=false};C.onwheel=e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.65,zoom-e.deltaY*.001));draw()};
function setMode(m){mode=m;buildBtn.classList.toggle('active',m==='build');removeBtn.classList.toggle('active',m==='remove')}buildBtn.onclick=()=>setMode('build');removeBtn.onclick=()=>setMode('remove');pal.forEach((p,i)=>{let b=document.createElement('button');b.className='sw'+(!i?' on':'');b.style.setProperty('--c',p);b.onclick=()=>{color=i;document.querySelectorAll('.sw').forEach((x,j)=>x.classList.toggle('on',i===j))};colorsEl.appendChild(b)});soundBtn.onclick=()=>{ping(true);toastEl.textContent='sound on';toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),700)};newBtn.onclick=()=>{cells.forEach(c=>c.h=0);localStorage.removeItem('tidemill');countEl.textContent='0 homes';draw()};let saved=localStorage.tidemill;if(saved)try{JSON.parse(saved).forEach((v,i)=>{if(cells[i]){cells[i].h=v[0];cells[i].col=v[1]}})}catch{}else [[0,0,3],[1,0,2],[0,1,2],[1,-1,1],[-1,1,1],[-1,0,2],[2,-1,1]].forEach(([q,r,h],i)=>{let c=map.get(key(q,r));if(c){c.h=h;c.col=i%pal.length}});countEl.textContent=cells.reduce((s,c)=>s+c.h,0)+' blocks';resize();setInterval(draw,50);setTimeout(()=>hintEl.classList.add('hide'),5000)})();
</script></body></html>
